nginx.conf:

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
        worker_connections 768;
        # multi_accept on;
}

http {

        ##
        # Basic Settings
        ##

        sendfile on;
        tcp_nopush on;
        types_hash_max_size 2048;
        # server_tokens off;

        # server_names_hash_bucket_size 64;
        # server_name_in_redirect off;

        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        ##
        # SSL Settings
        ##

        ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
        ssl_prefer_server_ciphers on;

        ##
        # Logging Settings
        ##
        proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=my_cache:10m max_size=1g inactive=60m use_temp_path=off;

        access_log /var/log/nginx/access.log;

        ##
        # Gzip Settings
        ##

        gzip on;

        # gzip_vary on;
        # gzip_proxied any;
        # gzip_comp_level 6;
        # gzip_buffers 16 8k;
        # gzip_http_version 1.1;
        # gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        ##
        # Virtual Host Configs
        ##

        include /etc/nginx/conf.d/*.conf;
        include /etc/nginx/sites-enabled/*;

        map $http_upgrade $connection_upgrade {
                default upgrade;
                ''      close;
        }
}

stream {
    resolver 8.8.8.8 8.8.4.4 valid=10s;

    log_format stream '$remote_addr [$time_local] '
                     '$protocol $status $bytes_sent $bytes_received '
                     '$session_time "$upstream_addr"';
    access_log /var/log/nginx/stream-access.log stream;
    error_log /var/log/nginx/stream-error.log debug;

    upstream chatbot_backend {
        server chatbot.weincloud.net:443;
    }

    server {
        listen 127.0.0.1:9443 ssl;
        ssl_certificate /etc/letsencrypt/live/sss55.space/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sss55.space/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        proxy_pass chatbot_backend;

        proxy_ssl on;
        ssl_certificate /etc/letsencrypt/live/sss55.space/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sss55.space/privkey.pem;
        proxy_ssl_server_name on;
        proxy_ssl_name chatbot.weincloud.net;
        proxy_ssl_verify off;

        proxy_connect_timeout 30s;
        proxy_timeout 30m;
    }

    upstream w1_backend {
        server w1.weintek.com:443;
    }

    server {
        listen 127.0.0.1:9445 ssl;
        ssl_certificate /etc/letsencrypt/live/sss55.space/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sss55.space/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        proxy_pass w1_backend;
        proxy_ssl on;
        ssl_certificate /etc/letsencrypt/live/sss55.space/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sss55.space/privkey.pem;
        proxy_ssl_server_name on;
        proxy_ssl_name w1.weintek.com;
        proxy_ssl_verify off;

        proxy_connect_timeout 30s;
        proxy_timeout 30m;
    }
}